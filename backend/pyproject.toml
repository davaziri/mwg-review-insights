[project]
name = "mwg-review-insights"
version = "0.1.0"
description = "Midwest Games Review Insights: Steam review ingestion and theme analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.150",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "httpx>=0.28",
    "pydantic-settings>=2.16",
    "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "respx>=0.23",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
