name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build

  # Builds and starts the app with Docker Compose the way a server does, then checks that the
  # pages load and that a PDF report can be printed inside the image.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: |
          echo "AUTH_MODE=local" > .env
          docker compose up -d --build --wait
      - name: Check the app
        run: |
          curl -fsS localhost:8000/api/health
          curl -fsS localhost:8000/ | grep -q 'id="root"'
          curl -fsS localhost:8000/api/titles | grep -q 'Tombwater'
          curl -fsS -o portfolio.pdf localhost:8000/api/portfolio/export.pdf
          head -c 4 portfolio.pdf | grep -q '%PDF'
          docker compose ps --status running --services | grep -qx worker
      - name: Show logs
        if: always()
        run: docker compose logs --no-color | tail -n 100
